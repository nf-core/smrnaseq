name: nf-core AWS full size tests
# This workflow is triggered on PRs opened against the main/master branch.
# It can be additionally triggered manually with GitHub actions workflow dispatch button.
# It runs the -profile 'test_full' on AWS batch

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  release:
    types: [published]

jobs:
  run-platform:
    name: Run AWS full tests
    # run only if the PR is approved by at least 2 reviewers and against the master/main branch or manually triggered
    if: github.repository == 'nf-core/smrnaseq' && github.event.review.state == 'approved' && (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Set revision variable
        id: revision
        run: |
          echo "revision=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && github.sha || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Launch workflow via Seqera Platform
        uses: seqeralabs/action-seqera-launch@v1
        # You can customise AWS full pipeline tests as required
        # Add full size test data (but still relatively small datasets for few samples)
        # on the `test_full.config` test runs with only one set of parameters
        with:
          wait: running
          # The compute environment's default Nextflow is older than manifest.nextflowVersion
          nextflow-version: "26.10.0"
          # Typed params in main.nf need the v2 syntax parser
          syntax-parser: v2
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: ${{ vars.TOWER_COMPUTE_ENV }}
          revision: ${{ steps.revision.outputs.revision }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}/work/smrnaseq/work-${{ steps.revision.outputs.revision }}
          # Keep the plugin versions in sync with the `plugins {}` block in nextflow.config
          nextflow-config: |
            plugins {
              id 'nf-co2footprint@1.4.1'
              id 'nf-core-utils@0.7.0'
              id 'nf-prov@1.8.0'
              id 'nf-schema@2.7.3'
              id 'nf-slack@0.5.0'
            }
            slack {
              enabled = true
              bot {
                token = '${{ secrets.NFSLACK_BOT_TOKEN }}'
                channel = 'smrnaseq'
              }
              onStart {
                enabled = false
              }
              onComplete {
                message = ':white_check_mark: *smrnaseq/test_full* completed successfully! :tada:'
              }
              onError {
                message = ':x: *smrnaseq/test_full* failed :crying_cat_face:'
              }
            }
          parameters: |
            {
              "outdir": "s3://${{ vars.AWS_S3_BUCKET }}/smrnaseq/results-${{ steps.revision.outputs.revision }}"
            }
          profiles: test_full
