# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "datatable/merge"
description: Merge mirtop result tables into a single miRNA count table.
keywords:
  - merge
  - datatable
  - mirna
  - mirtop
tools:
  - "data.table":
      description: "R package for fast aggregation and manipulation of tabular data."
      homepage: "https://r-datatable.com/"
      licence: ["MPL-2.0"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
        e.g. [ id:'test' ]
  - mirtop:
      type: file
      description: mirtop result table files to merge.
      pattern: "*.{tsv,txt,csv}"
output:
  - mirna_tsv:
      type: file
      description: Merged miRNA count table.
      pattern: "mirna.tsv"
  - versions:
      type: file
      description: File containing software versions.
      pattern: "versions.yml"
authors:
  - "@atrigila"
maintainers:
  - "@atrigila"
