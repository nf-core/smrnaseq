# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pivot/longer"
description: Convert mirtop count tables from wide to long format.
keywords:
  - pivot
  - mirna
  - csv
  - tidyr
tools:
  - "tidyr":
      description: "R package for reshaping and tidying data."
      homepage: "https://tidyr.tidyverse.org/"
      documentation: "https://tidyr.tidyverse.org/reference/"
      tool_dev_url: "https://github.com/tidyverse/tidyr"
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
        e.g. [ id:'test' ]
  - tsv:
      type: file
      description: Input mirtop count table.
      pattern: "*.{tsv,txt}"
output:
  - csv:
      type: file
      description: Long-format CSV file.
      pattern: "*_long.csv"
  - versions:
      type: file
      description: File containing software versions.
      pattern: "versions.yml"
authors:
  - "@atrigila"
maintainers:
  - "@atrigila"
