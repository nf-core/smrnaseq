# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pivot/wider"
description: Join long-format mirtop count tables and convert them to a wide sample-by-miRNA table.
keywords:
  - pivot
  - mirna
  - tsv
  - tidyr
tools:
  - "tidyr":
      description: "R package for reshaping and tidying data."
      homepage: "https://tidyr.tidyverse.org/"
      documentation: "https://tidyr.tidyverse.org/reference/"
      tool_dev_url: "https://github.com/tidyverse/tidyr"
      licence: ["MIT"]
  - "r-base":
      description: "R: a language and environment for statistical computing and graphics."
      homepage: "https://www.r-project.org/"
      licence: ["GPL-2.0-or-later"]
  - "dplyr":
      description: "R package providing a grammar of data manipulation."
      homepage: "https://dplyr.tidyverse.org/"
      licence: ["MIT"]
  - "vroom":
      description: "R package to read and write rectangular text data quickly."
      homepage: "https://vroom.r-lib.org/"
      licence: ["MIT"]
  - "optparse":
      description: "R package for command line option parsing."
      homepage: "https://cran.r-project.org/package=optparse"
      licence: ["GPL-2.0-or-later"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing result group information.
        e.g. [ id:'Long_Files' ]
  - csvs:
      type: file
      description: Long-format CSV files to join and pivot.
      pattern: "*_long.csv"
output:
  - csv:
      type: file
      description: Joined wide-format mirtop result table.
      pattern: "*joined_samples_mirtop.tsv"
authors:
  - "@atrigila"
maintainers:
  - "@atrigila"
